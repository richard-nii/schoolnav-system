server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WASM needs the correct MIME type for .wasm files.
    types {
        application/wasm wasm;
    }

    # SPA fallback: any route Blazor's client-side router owns (like /admin,
    # /admin/login) must still serve index.html so Blazor can take over routing,
    # instead of nginx returning a 404 on a direct load or page refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
